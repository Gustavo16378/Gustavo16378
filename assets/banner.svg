<svg viewBox="0 0 900 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gustavo Dev. Sistemas, APIs e sites autorais. Do conceito ao deploy.">
  <style>
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .mono  { font-family: 'Courier New', monospace; }

    .fade-up {
      opacity: 0;
      animation: fadeUp 0.9s ease-out forwards;
    }
    .d1 { animation-delay: 0.15s; }
    .d2 { animation-delay: 0.45s; }
    .d3 { animation-delay: 0.75s; }
    .d4 { animation-delay: 1.05s; }

    .rule {
      transform-origin: center;
      transform: scaleX(0);
      animation: expand 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: 0.6s;
    }

    .diamond {
      opacity: 0;
      animation: fadeIn 0.6s ease-out forwards;
      animation-delay: 1.2s;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes expand {
      to { transform: scaleX(1); }
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
  </style>

  <!-- fundo -->
  <rect x="1" y="1" width="898" height="248" rx="14" fill="#0d1117" stroke="#d4a95f" stroke-opacity="0.25" stroke-width="1"/>

  <!-- moldura interna fina, detalhe editorial -->
  <rect x="14" y="14" width="872" height="222" rx="8" fill="none" stroke="#d4a95f" stroke-opacity="0.12" stroke-width="1"/>

  <!-- sobretítulo -->
  <text class="mono fade-up d1" x="450" y="66" text-anchor="middle" font-size="12" letter-spacing="6" fill="#8b949e">DESENVOLVEDOR FULL-STACK</text>

  <!-- título -->
  <text class="serif fade-up d2" x="450" y="128" text-anchor="middle" font-size="58" letter-spacing="2" fill="#d4a95f">GUSTAVO DEV<tspan fill="#c9d1d9">.</tspan></text>

  <!-- filetes + losango -->
  <g>
    <line class="rule" x1="270" y1="156" x2="430" y2="156" stroke="#d4a95f" stroke-opacity="0.55" stroke-width="1"/>
    <line class="rule" x1="470" y1="156" x2="630" y2="156" stroke="#d4a95f" stroke-opacity="0.55" stroke-width="1"/>
    <rect class="diamond" x="444" y="150" width="12" height="12" transform="rotate(45 450 156)" fill="none" stroke="#d4a95f" stroke-width="1"/>
  </g>

  <!-- tagline -->
  <text class="serif fade-up d3" x="450" y="192" text-anchor="middle" font-size="19" font-style="italic" fill="#c9d1d9">Sistemas, APIs e sites autorais. Do conceito ao deploy.</text>

  <!-- rodapé do banner -->
  <text class="mono fade-up d4" x="450" y="222" text-anchor="middle" font-size="10" letter-spacing="4" fill="#8b949e">PALMAS &#183; TOCANTINS &#183; BRASIL</text>
</svg>
